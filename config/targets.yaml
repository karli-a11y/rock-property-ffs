# config/targets.yaml  — target variable definitions

targets:
  main:
    - name: porosity_pct
      label: "Porosity (%)"
      unit: "%"
      min_samples: 30
      harmonization_risk: moderate
      notes: "Multiple porosity sub-types pooled (total, effective, connected)"

    - name: bulk_density_gcm3
      label: "Bulk Density (g/cm³)"
      unit: "g/cm³"
      min_samples: 30
      harmonization_risk: low
      notes: "Comparatively robust; dry and wet pooled with flag"

    - name: vp_dry_ms
      label: "Dry P-wave velocity (m/s)"
      unit: "m/s"
      min_samples: 30
      harmonization_risk: moderate
      notes: "Dry-state P-wave velocity; method differences possible"

    - name: ucs_MPa
      label: "UCS (MPa)"
      unit: "MPa"
      min_samples: 30
      harmonization_risk: high
      notes: "High risk: loading rate, specimen prep, geometry vary across sources"

    - name: E_static_GPa
      label: "Static Young's modulus (GPa)"
      unit: "GPa"
      min_samples: 30
      harmonization_risk: high
      notes: "Static (destructive) vs dynamic (ultrasonic) pooled in some sources"

    - name: tc_dry_WmK
      label: "Dry thermal conductivity (W/(m·K))"
      unit: "W/(m·K)"
      min_samples: 30
      harmonization_risk: moderate
      notes: "Method differences: optical scanning, needle probe, divided bar"

  secondary:
    - name: grain_density_gcm3
      label: "Grain Density (g/cm³)"
      unit: "g/cm³"
      min_samples: 30
      harmonization_risk: low
      notes: "Mineral grain density; directly linked to bulk density and porosity"

    - name: permeability_m2
      label: "Permeability (m²)"
      unit: "m²"
      min_samples: 30
      harmonization_risk: high
      notes: "High variability; measurement method and confining pressure vary strongly"

    - name: td_dry_1e6m2s
      label: "Thermal diffusivity dry (1e-6 m²/s)"
      unit: "1e-6 m²/s"
      min_samples: 30
      harmonization_risk: moderate
      notes: "Derived from tc, cp, density; circular with tc_dry"

    - name: cp_JkgK
      label: "Specific heat capacity (J/(kg·K))"
      unit: "J/(kg·K)"
      min_samples: 30
      harmonization_risk: low
      notes: "Comparatively low risk; limited database coverage"

    - name: vs_dry_ms
      label: "Dry S-wave velocity (m/s)"
      unit: "m/s"
      min_samples: 30
      harmonization_risk: moderate
      notes: "Shear velocity; physically linked to Vp, circular with acoustic suite"

    - name: E_dyn_GPa
      label: "Dynamic Young's modulus (GPa)"
      unit: "GPa"
      min_samples: 30
      harmonization_risk: moderate
      notes: "Derived from velocity; circular with acoustic suite and static moduli"

    - name: poisson_ratio
      label: "Poisson ratio (–)"
      unit: "–"
      min_samples: 30
      harmonization_risk: high
      notes: "High variability; derived statically or dynamically"

    - name: tensile_MPa
      label: "Tensile strength (MPa)"
      unit: "MPa"
      min_samples: 30
      harmonization_risk: high
      notes: "Brazilian test most common; circular with UCS strength suite"

    - name: mag_susc_1e3si
      label: "Magnetic susceptibility (10⁻³ SI)"
      unit: "10⁻³ SI"
      min_samples: 30
      harmonization_risk: low
      notes: "Magnetic susceptibility; well-defined units across compendia"

    - name: friction_angle_deg
      label: "Friction angle (°)"
      unit: "°"
      min_samples: 30
      harmonization_risk: high
      notes: "Mohr-Coulomb φ as published; sparse globally (n~160), high method variability"

    - name: cohesion_MPa
      label: "Cohesion (MPa)"
      unit: "MPa"
      min_samples: 30
      harmonization_risk: high
      notes: "Mohr-Coulomb c as published; sparse globally (n~160)"

# Circularity exclusion rules (minimal, evidence-based — 2026-06-26).
# Only the DYNAMIC elastic moduli are excluded, because they are not measured
# independently but computed algebraically from the P/S-wave velocities and
# density (E_dyn = rho_b*Vs^2*(3Vp^2-4Vs^2)/(Vp^2-Vs^2); nu = (Vp^2-2Vs^2)/
# (2(Vp^2-Vs^2))). Using a derived modulus to predict its own constituents, or
# vice versa, restates a definition rather than an empirical relationship.
# Everything else (the two velocities, densities, porosity, thermal properties,
# strength measures, static Young's modulus) is an independent laboratory
# measurement and is NOT excluded.
# NOTE (2026-06-29): the only quantity that is, by construction, always
# computed from other columns is the dynamic Young's modulus E_dyn
# (= f(Vp, Vs, rho_b)). It is kept as a target but never used as a predictor
# (target_registry.NEVER_PREDICTOR); and when it is the target, its
# constituents Vp, Vs, bulk density are removed from its predictor pool via
# the rule below so they cannot trivially reconstruct it. The Poisson ratio is
# NOT excluded: its column mixes statically measured and dynamically derived
# values, so it is treated as an ordinary measured variable. No rows are
# dropped and no other relationship is removed by hand.
circularity_rules:
  E_dyn_GPa: [vp_dry_ms, vs_dry_ms, bulk_density_gcm3]
